<h2 mat-dialog-title>Cargar documento</h2>
<h1>Aqui agregar alguna descripcion</h1>
<mat-dialog-content>
  <file-upload [control]="fileUploadControl"></file-upload>
</mat-dialog-content>

<form [formGroup]="formGroup">
  @for (control of controls; track control.order) {
    <mat-form-field [appearance]="control.appearance">
      <mat-label>{{control.label}}</mat-label>
      <input matInput [formControlName]="control.name" [placeholder]="control.placeholder">
    </mat-form-field>
  }
</form>

<mat-form-field>
  <mat-label>Carpeta</mat-label>
  <mat-select>

    <mat-option>Sin carpeta</mat-option>
  </mat-select>
</mat-form-field>

<mat-chip-listbox class="mat-mdc-chip-set-stacked" aria-label="Cutest dog breeds">
  <mat-label>Etiquetas</mat-label>
  <!---@for (dog of bestBoys; track dog) {
    <mat-chip-option selected>{{dog}}</mat-chip-option>
  } --->
</mat-chip-listbox>

<mat-dialog-actions>
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton (click)="uploadContent()" cdkFocusInitial>Subir documentos</button>
</mat-dialog-actions>
