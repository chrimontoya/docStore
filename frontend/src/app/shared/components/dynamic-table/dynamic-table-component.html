<table mat-table [dataSource]="dataSource" class="mat-shadow-2">

  @for (column of config.columns; track column.id) {

    <ng-container [matColumnDef]="column.label">

      <th
        mat-header-cell
        *matHeaderCellDef
        [style.width]="column.width"
        [style.text-align]="column.align">

        {{ column.label }}

      </th>

      <td
        mat-cell
        *matCellDef="let row"
        [style.text-align]="column.align">

        {{ formatValue(row, column) }}

      </td>

    </ng-container>

  }

  <!-- ACCIONES -->
  @if (config.actions) {

    <ng-container matColumnDef="actions">

      <th
        mat-header-cell
        *matHeaderCellDef
        style="width: 120px; text-align: center;">

        Acciones

      </th>

      <td
        mat-cell
        *matCellDef="let row"
        style="text-align: center;">

        @for (action of config.actions; track action.id) {

          <button
            mat-icon-button
            [matTooltip]="action.label"
            (click)="onAction(action, row)">

            <mat-icon>
              {{ action.icon }}
            </mat-icon>

          </button>

        }

      </td>

    </ng-container>

  }

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns">
  </tr>

  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;">
  </tr>

</table>
